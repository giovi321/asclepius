[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asclepius"
version = "1.6.0"
description = "Asclepius — self-hosted medical records manager"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "aiosqlite>=0.22.1",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "bcrypt>=5.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
    "pytesseract>=0.3.13",
    "pydicom>=3.0.2",
    "pymupdf>=1.28.2",
    "httpx>=0.28.1",
    "anthropic>=1.4.0",
    "pillow>=12.3.0",
    "python-magic>=0.4.27",
    "authlib>=1.8.0",
    "numpy>=2.5.2",
    "rapidfuzz>=3.14.6",
    "aiosmtplib>=5.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.16.6",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"asclepius.llm" = ["prompts_data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

# Pin the rule set explicitly. Ruff changes its *default* selection in minor
# releases, and because the dev extra tracks ``ruff>=...`` every such release
# silently re-lints the whole backend. 0.16.0 widened the defaults from
# ``E4,E7,E9,F`` to also include B, BLE, DTZ, I, S, SIM, UP and more, which
# turned every open PR red with 575 pre-existing findings -- 319 of them
# B008, which is a false positive for FastAPI's ``Depends()`` defaults.
# Listing the rules here keeps the gate deterministic across ruff upgrades.
# Widen it deliberately, with the resulting fixes in the same commit.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
